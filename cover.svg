<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#22d3ee" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Terminal frame -->
  <rect x="80" y="120" width="1120" height="480" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4" rx="6"/>

  <!-- Title -->
  <text x="640" y="320" font-family="Consolas, Monaco, monospace" font-size="120" font-weight="bold" fill="url(#title)" text-anchor="middle" filter="url(#glow)">webpath-scan</text>

  <!-- Version -->
  <text x="640" y="400" font-family="Consolas, Monaco, monospace" font-size="36" fill="#94a3b8" text-anchor="middle" letter-spacing="8">v 1 . 1</text>

  <!-- Tagline -->
  <text x="640" y="500" font-family="Consolas, Monaco, monospace" font-size="22" fill="#22d3ee" text-anchor="middle" letter-spacing="4">WEB PATH DISCOVERY · MIT · WINDOWS</text>

  <!-- Bottom badges -->
  <g font-family="Consolas, Monaco, monospace" font-size="18" fill="#64748b" text-anchor="middle">
    <text x="320" y="580">SSRF DEFENSE</text>
    <text x="640" y="580">SECRET REDACTION</text>
    <text x="960" y="580">10/10 SELF-CHECK</text>
  </g>

  <!-- Corner accents -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="80,140 80,100 120,100"/>
    <polyline points="1200,100 1200,140"/>
    <polyline points="80,580 80,620 120,620"/>
    <polyline points="1200,620 1200,580"/>
  </g>
</svg>
