<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>webpath-scan · 订单 Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0a0e14; --card: #131923; --elev: #1a2230; --text: #e2e8f0; --muted: #64748b;
    --border: #1e293b; --accent: #22d3ee; --green: #34d399; --orange: #fb923c; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  h1::before { content: ''; display: inline-block; width: 8px; height: 22px; background: linear-gradient(180deg, #22d3ee, #a78bfa); border-radius: 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .sub code { color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
  .stat .delta { font-size: 12px; margin-top: 4px; }
  .stat .delta.up { color: var(--green); }
  .stat .delta.down { color: var(--red); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  td.id { font-family: 'Consolas', monospace; color: var(--accent); }
  td.key { font-family: 'Consolas', monospace; color: var(--green); font-size: 11px; }
  td.amt { font-family: 'Consolas', monospace; color: var(--orange); text-align: right; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge.paid { background: rgba(34, 211, 238, 0.15); color: var(--accent); }
  .badge.pending { background: rgba(251, 146, 60, 0.15); color: var(--orange); }
  .badge.shipped { background: rgba(52, 211, 153, 0.15); color: var(--green); }
  .badge.refunded { background: rgba(248, 113, 113, 0.15); color: var(--red); }

  .chart { display: flex; align-items: flex-end; height: 100px; gap: 6px; padding: 8px 0; }
  .bar { flex: 1; background: linear-gradient(180deg, var(--accent), #1e40af); border-radius: 4px 4px 0 0; position: relative; min-height: 4px; transition: height 0.3s; }
  .bar .lbl { position: absolute; bottom: -20px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }
  .bar .val { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--text); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar .spacer { flex: 1; }
  button { background: var(--elev); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .empty { text-align: center; color: var(--muted); padding: 32px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>webpath-scan · 订单 Dashboard</h1>
  <div class="sub">实时订单监控 · <code id="lastUpdate">--</code> · 每 15s 自动刷新</div>

  <div class="toolbar">
    <span class="status"><span class="dot"></span><span id="connStatus">已连接</span></span>
    <span class="spacer"></span>
    <button onclick="loadData()">手动刷新</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">今日</div>
      <div class="value" id="statToday">--</div>
      <div class="delta" id="statTodayDelta">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="label">本周</div>
      <div class="value" id="statWeek">--</div>
      <div class="delta" id="statWeekDelta">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="label">本月</div>
      <div class="value" id="statMonth">--</div>
      <div class="delta" id="statMonthDelta">&nbsp;</div>
    </div>
    <div class="stat">
      <div class="label">全部</div>
      <div class="value" id="statTotal">--</div>
      <div class="delta">&nbsp;</div>
    </div>
  </div>

  <div class="card">
    <h2>最近 7 天订单</h2>
    <div class="chart" id="chart"></div>
  </div>

  <div class="card">
    <h2>最近订单</h2>
    <table id="ordersTable">
      <thead>
        <tr>
          <th>订单号</th>
          <th>买家</th>
          <th>平台</th>
          <th>密钥</th>
          <th>状态</th>
          <th>金额</th>
          <th>时间</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="7" class="empty">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || 'change-me-in-production';
const PRICE_BY_PLATFORM = { xianyu: 19, wechat: 39, knowledge: 99, manual: 29, gumroad: 19 };
const PLATFORM_LABEL = { xianyu: '闲鱼', wechat: '微信', knowledge: '知识星球', manual: '手动', gumroad: 'Gumroad' };

async function loadData() {
  try {
    const res = await fetch('/admin/orders', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
    document.getElementById('connStatus').textContent = '已连接';
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('connStatus').textContent = '连接失败: ' + e.message;
  }
}

function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d) { const x = startOfDay(d); x.setDate(x.getDate() - x.getDay()); return x; }
function startOfMonth(d) { const x = startOfDay(d); x.setDate(1); return x; }

function render(data) {
  const orders = (data.orders || []).slice().reverse();
  const now = new Date();
  const sod = startOfDay(now), sow = startOfWeek(now), som = startOfMonth(now);

  const today = orders.filter(o => new Date(o.createdAt) >= sod);
  const week = orders.filter(o => new Date(o.createdAt) >= sow);
  const month = orders.filter(o => new Date(o.createdAt) >= som);
  const total = orders;

  const sum = (arr) => arr.reduce((s, o) => s + (PRICE_BY_PLATFORM[o.platform] || 0), 0);

  document.getElementById('statToday').textContent = today.length + ' 单';
  document.getElementById('statTodayDelta').textContent = '¥' + sum(today);
  document.getElementById('statWeek').textContent = week.length + ' 单';
  document.getElementById('statWeekDelta').textContent = '¥' + sum(week);
  document.getElementById('statMonth').textContent = month.length + ' 单';
  document.getElementById('statMonthDelta').textContent = '¥' + sum(month);
  document.getElementById('statTotal').textContent = total.length + ' 单';

  // 7-day bar chart
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const count = orders.filter(o => { const t = new Date(o.createdAt); return t >= d && t < next; }).length;
    days.push({ date: d, count });
  }
  const max = Math.max(...days.map(d => d.count), 1);
  const chart = document.getElementById('chart');
  chart.innerHTML = days.map(d => {
    const h = Math.max(4, (d.count / max) * 80);
    const lbl = (d.date.getMonth() + 1) + '/' + d.date.getDate();
    return `<div class="bar" style="height:${h}px" title="${lbl}: ${d.count} 单"><div class="val">${d.count || ''}</div><div class="lbl">${lbl}</div></div>`;
  }).join('');

  // Orders table
  const tbody = document.getElementById('ordersBody');
  if (orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">还没有订单 - 访问 <code>/order</code> 创建第一个测试订单</td></tr>';
    return;
  }
  tbody.innerHTML = orders.slice(0, 30).map(o => {
    const statusClass = (o.status || 'pending').toLowerCase();
    const dt = new Date(o.createdAt);
    return `<tr>
      <td class="id">${o.orderId || ''}</td>
      <td>${o.buyer || ''}</td>
      <td>${PLATFORM_LABEL[o.platform] || o.platform || ''}</td>
      <td class="key">${(o.key || '').slice(0, 12)}</td>
      <td><span class="badge ${statusClass}">${o.status || 'pending'}</span></td>
      <td class="amt">¥${PRICE_BY_PLATFORM[o.platform] || 0}</td>
      <td>${dt.toLocaleString()}</td>
    </tr>`;
  }).join('');
}

loadData();
setInterval(loadData, 15000);
</script>
</body>
</html>
