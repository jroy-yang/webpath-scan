<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webpath-scan v1.1 · 一键领取</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0e14; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #131923; border: 1px solid #1e293b; border-radius: 12px; padding: 32px; max-width: 480px; width: 100%; }
  h1 { margin: 0 0 8px; font-size: 22px; color: #22d3ee; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
  .field { background: #0a0e14; border: 1px solid #1e293b; border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; }
  .field label { display: block; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; background: transparent; color: #e2e8f0; border: none; font-size: 14px; font-family: inherit; }
  .field input:focus, .field textarea:focus { outline: 1px solid #22d3ee; }
  button { width: 100%; background: linear-gradient(135deg, #22d3ee, #a78bfa); color: #0a0e14; border: none; padding: 14px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { padding: 12px 16px; border-radius: 6px; margin: 12px 0; font-size: 14px; }
  .status.success { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
  .status.error { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
  .download-link { display: block; background: #0a0e14; border: 1px solid #22d3ee; color: #22d3ee; padding: 14px; border-radius: 6px; text-decoration: none; text-align: center; margin: 12px 0; font-family: 'Consolas', monospace; word-break: break-all; }
  .code { background: #0a0e14; padding: 8px 12px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 13px; }
  .meta { color: #64748b; font-size: 11px; text-align: center; margin-top: 16px; }
  .hidden { display: none; }
  .copy-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-left: 8px; }
  .copy-btn:hover { color: #22d3ee; }
</style>
</head>
<body>
<div class="card">
  <h1>🎯 webpath-scan v1.1</h1>
  <div class="sub">输入订单号 + 密钥，一键领取下载链接</div>

  <form id="claimForm">
    <div class="field">
      <label>订单号</label>
      <input type="text" id="orderId" name="orderId" placeholder="XY-2024001" required>
    </div>
    <div class="field">
      <label>密钥（发货邮件/消息里有）</label>
      <input type="text" id="key" name="key" placeholder="WPS-XXXX" required>
    </div>
    <button type="submit" id="submitBtn">领取下载</button>
  </form>

  <div id="status" class="status hidden"></div>
  <div id="result" class="hidden">
    <a id="dlLink" class="download-link" href="#" target="_blank" rel="noopener">📦 立即下载</a>
    <div class="field">
      <label>提取码 <button type="button" class="copy-btn" id="copyPwd">复制</button></label>
      <div class="code" id="password"></div>
    </div>
    <div class="field">
      <label>SHA-256 (验证用) <button type="button" class="copy-btn" id="copyHash">复制</button></label>
      <div class="code" id="sha256" style="font-size: 11px; word-break: break-all;"></div>
    </div>
    <div class="field">
      <label>订单密钥 <button type="button" class="copy-btn" id="copyKey">复制</button></label>
      <div class="code" id="orderKey"></div>
    </div>
  </div>

  <div class="meta">
    ⚠️ 授权测试使用 · MIT 协议<br>
    技术支持：见 README.md
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const status = $('status');
const result = $('result');

function showStatus(msg, type) {
  status.className = 'status ' + type;
  status.textContent = msg;
  status.classList.remove('hidden');
}

function showError(msg) {
  showStatus('❌ ' + msg, 'error');
  result.classList.add('hidden');
}

function showSuccess(data) {
  showStatus('✅ 验证通过！链接已生成（请尽快下载）', 'success');
  $('dlLink').href = data.url;
  $('dlLink').textContent = '📦 ' + data.url;
  $('password').textContent = data.password;
  $('sha256').textContent = data.sha256;
  $('orderKey').textContent = data.key;
  result.classList.remove('hidden');
}

$('claimForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('submitBtn').disabled = true;
  $('submitBtn').textContent = '验证中...';
  status.classList.add('hidden');
  result.classList.add('hidden');
  try {
    const res = await fetch('/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orderId: $('orderId').value.trim(),
        key: $('key').value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '领取失败');
    showSuccess(data);
  } catch (err) {
    showError(err.message);
  } finally {
    $('submitBtn').disabled = false;
    $('submitBtn').textContent = '领取下载';
  }
});

// 复制按钮
['Pwd', 'Hash', 'Key'].forEach(s => {
  $('copy' + s).addEventListener('click', () => {
    const text = $(s.toLowerCase()).textContent;
    navigator.clipboard.writeText(text).then(() => {
      $('copy' + s).textContent = '✓';
      setTimeout(() => $('copy' + s).textContent = '复制', 1500);
    });
  });
});
</script>
</body>
</html>
